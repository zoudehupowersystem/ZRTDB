name: One-time official source metadata update

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update:
    if: github.event.issue.title == '[internal] update ZRTDB official source metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          marker = '<!-- official-project-source -->'
          blocks = {
              'README.md': '''<!-- official-project-source -->
> **官方项目 / Official Project**  
> **项目 / Project:** ZRTDB — Zero-copy Real-Time Data Bus  
> **作者 / Author:** [Dehu Zou（邹德虎）](https://zoudehupowersystem.github.io/)  
> **官方仓库 / Official Repository:** https://github.com/zoudehupowersystem/ZRTDB  
> **个人主页 / Homepage:** https://zoudehupowersystem.github.io/
>
> 本仓库是 **ZRTDB 的官方发布源（canonical source）**。如需引用、转载、镜像或二次开发，请保留原项目名称、作者信息、官方仓库链接以及适用的开源许可证声明。
''',
              'README_E.md': '''<!-- official-project-source -->
> **Official Project:** ZRTDB — Zero-copy Real-Time Data Bus  
> **Author:** [Dehu Zou (邹德虎)](https://zoudehupowersystem.github.io/)  
> **Official Repository:** https://github.com/zoudehupowersystem/ZRTDB  
> **Homepage:** https://zoudehupowersystem.github.io/
>
> This repository is the **official and canonical source of ZRTDB**. When citing, redistributing, mirroring, or deriving work from ZRTDB, please retain the original project name, author attribution, official repository link, and the applicable open-source license notices.
'''
          }

          for filename, block in blocks.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  continue
              lines = text.splitlines(keepends=True)
              pos = next((i for i, line in enumerate(lines) if line.startswith('# ')), None)
              if pos is None:
                  raise SystemExit(f'No H1 found in {filename}')
              insert_at = pos + 1
              new = ''.join(lines[:insert_at]) + '\n' + block + '\n' + ''.join(lines[insert_at:])
              p.write_text(new, encoding='utf-8')
          PY

      - name: Try to update repository description, homepage and topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${GITHUB_REPOSITORY}" -X PATCH \
            -f description='ZRTDB — zero-copy real-time data bus for deterministic shared-memory data exchange in SCADA, control and industrial systems.' \
            -f homepage='https://zoudehupowersystem.github.io/'
          echo "repository_patch_rc=$?"
          gh api "repos/${GITHUB_REPOSITORY}/topics" -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -f 'names[]=zrtdb' \
            -f 'names[]=zero-copy' \
            -f 'names[]=real-time' \
            -f 'names[]=shared-memory' \
            -f 'names[]=scada' \
            -f 'names[]=industrial-software' \
            -f 'names[]=data-bus' \
            -f 'names[]=cpp' \
            -f 'names[]=rust' \
            -f 'names[]=power-systems'
          echo "topics_put_rc=$?"
          exit 0

      - name: Commit README changes and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/official-source-metadata.yml
          git add README.md README_E.md
          git commit -m 'Mark ZRTDB official source and link author homepage'
          git push

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed
