name: Bootstrap NETMOM implementation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netmom-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize NETMOM implementation
        shell: bash
        run: |
          : > /tmp/netmom.b64
          printf '%s' '' >> /tmp/netmom.b64
          printf '%s' '' >> /tmp/netmom.b64
          printf '%s' '' >> /tmp/netmom.b64
          printf '%s' '' >> /tmp/netmom.b64
          printf '%s' '' >> /tmp/netmom.b64
          printf '%s' '' >> /tmp/netmom.b64
          printf '%s' '' >> /tmp/netmom.b64
          base64 --decode /tmp/netmom.b64 > /tmp/netmom.tar.gz
          tar -xzf /tmp/netmom.tar.gz -C .
          test -f DAT/NETMOM.DAT
          test -f netmom/Topology.cpp

      - name: Configure and build NETMOM targets
        run: |
          cmake -S . -B build-netmom -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-netmom --target netmom_tests zrtdb_bpa_import zrtdb_topology -j2

      - name: Run NETMOM tests
        run: ctest --test-dir build-netmom --output-on-failure -R '^netmom_tests$'

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/netmom-bootstrap.yml
          git add CMakeLists.txt DAT/APPDAT.json DAT/NETMOM.DAT include/netmom netmom
          git diff --cached --check
          git commit -m 'Add NETMOM BPA importer and topology engine'
          git push
